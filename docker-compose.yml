# Local development: everything runs in containers. No bind mounts, so it
# works without Docker Desktop file sharing for this folder.
#   docker compose up --watch web                                    → http://localhost:8090
#   docker compose run --rm --build dev node --test tests/*.test.js  → unit tests
# The images are the stages of Dockerfile.
# Model files mirrored into ./models (git-ignored, see README) are served at
# /models, and the app uses them instead of Hugging Face on localhost.
services:
  web:
    network_mode: bridge # default bridge, no per-project network needed
    build:
      context: .
      target: web
    ports:
      - "8090:80"
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/share/nginx/html
          ignore:
            - models/

  dev:
    network_mode: bridge
    profiles: ["tools"]
    build:
      context: .
      target: dev
